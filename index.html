<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bundesliga Squad Cycle Radar</title>
</head>
<body>
  <header>
    <div class="header-inner">
      <div>
        <h1>Bundesliga Squad Cycle Radar</h1>
        <p class="subtitle">Kaderzyklen 2025/26 — Alter, Leistung &amp; strategischer Ausblick</p>
      </div>
      <nav class="tabs" id="tabs">
        <button class="tab active" data-tab="chart">Diagramm</button>
        <button class="tab" data-tab="data">Vereine</button>
      </nav>
    </div>
  </header>

  <main>
    <!-- Filters (shared) -->
    <div class="filters" id="filters"></div>

    <!-- Tab: Diagramm -->
    <div id="tab-chart" class="tab-panel">
      <div class="chart-wrap">
        <canvas id="scatter-chart"></canvas>
      </div>
    </div>

    <!-- Tab: Vereine -->
    <div id="tab-data" class="tab-panel hidden">
      <div class="table-wrap">
        <table id="club-table">
          <thead>
            <tr>
              <th>Verein</th>
              <th>Phase</th>
              <th class="num">Ø Alter</th>
              <th class="num">Ø Note</th>
              <th class="num">Benotet</th>
              <th>Top-Spieler</th>
            </tr>
          </thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Modal -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <button class="modal-close" id="modal-close">✕</button>
      <div id="modal-content"></div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
